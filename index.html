<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dopa-Math</title>
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#fff0f7;--bg2:#e6efff;--card:#ffffff;--text:#1d1536;--sub:#6e6890;--pink:#ff2d8f;--ok:#0fbf6a;--ng:#ff4a4a;--gold:#ffb300;--cyan:#00d8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b0a33;--bg2:#08183a;--card:#2a1d52;--text:#f6f2ff;--sub:#b0a8dc}}
:root[data-theme="dark"]{--bg1:#1b0a33;--bg2:#08183a;--card:#2a1d52;--text:#f6f2ff;--sub:#b0a8dc}
/* 着せ替えテーマ。ダークモードより後に書いて、選んだテーマを優先する */
:root[data-skin="cafe"]{color-scheme:light;--bg1:#f7efe6;--bg2:#ecdcc9;--card:#fffaf4;--text:#4a3428;--sub:#9a7f6c;--pink:#c4865b;--gold:#e0ad62;--ok:#8fb07a}
:root[data-skin="sky"]{color-scheme:light;--bg1:#eef8ff;--bg2:#dcefff;--card:#ffffff;--text:#24405c;--sub:#7d97ad;--pink:#4fb3f0;--gold:#b49cff}
:root[data-skin="neon"]{color-scheme:dark;--bg1:#0b0b1e;--bg2:#160b30;--card:#1a1636;--text:#eafcff;--sub:#8fa0c8;--pink:#ff2bd6;--gold:#00f0ff;--ok:#39ff88}
:root[data-skin="neon"] .key{box-shadow:0 0 0 1px rgba(0,240,255,.35),0 5px 0 rgba(0,240,255,.25)}
:root[data-skin="oshi"]{--pink:var(--oshi,#ff2d8f)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body.fever{background:linear-gradient(120deg,#ff2d8f,#ffb300,#7a3cff,#00c2ff);background-size:300% 300%;animation:fv 1.2s linear infinite}
@keyframes fv{0%{background-position:0% 50%}100%{background-position:100% 50%}}
button{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:10px 16px 14px}
.hud{display:flex;align-items:center;gap:10px;font-weight:800}
.hud button{background:none;border:0;font-size:22px;cursor:pointer;color:inherit;padding:2px 4px}
#stg{font-size:13px;background:var(--card);border-radius:99px;padding:3px 10px;white-space:nowrap}
#sc{font-size:26px;font-variant-numeric:tabular-nums;margin-left:auto}
#cb{font-size:16px;color:var(--pink);min-width:74px;text-align:right}
body.fever #cb{color:#fff}
.bar{height:10px;border-radius:99px;background:rgba(127,127,160,.25);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:99px;transition:width .3s}
/* 親黙らせ（TikTok解禁）ゲージ */
.oya{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-top:6px}
.oya .bar{flex:1;margin:0;height:12px}
.oya .bar i{background:linear-gradient(90deg,#00f2ea,#ff0050)}
.oya b{white-space:nowrap;font-size:12px}
.oya.full b{color:var(--pink)}
.prog{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:800;color:var(--sub)}
#heartsP{letter-spacing:-2px;font-size:13px}
/* 1問ごとの制限時間。左の明るい区間がスピードボーナス圏内 */
.tbar{position:absolute;top:0;left:0;right:0;height:8px;border-radius:30px 30px 0 0;overflow:hidden;background:rgba(127,127,160,.18)}
.tbar i{display:block;height:100%;width:100%;background:var(--ok);transform-origin:left;will-change:transform}
.tbar i.mid{background:var(--gold)}
.tbar i.low{background:var(--ng)}
.tbar b{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.9)}
.prog .bar{flex:1;margin:0;height:6px}
/* ボス */
.boss{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:6px 12px;margin-top:8px;position:relative}
.bemo{font-size:44px;line-height:1;transition:filter .2s;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg) scale(1.06)}}
.bemo.hit{animation:bhit .35s}
.bemo.atk{animation:batk .45s}
.bemo.dead{animation:bdead .8s forwards}
@keyframes bhit{30%{transform:translateX(8px) rotate(12deg);filter:brightness(2.2)}60%{transform:translateX(-6px)}}
@keyframes batk{40%{transform:scale(1.6) translateY(14px)}}
@keyframes bdead{to{transform:scale(.2) rotate(360deg);opacity:0}}
.binfo{flex:1;min-width:0}
.bname{display:flex;justify-content:space-between;font-size:13px;font-weight:900}
#hearts{letter-spacing:-2px;font-size:13px}
.bar.hp{height:14px;margin-top:4px}
.bar.hp i{background:linear-gradient(90deg,#ff4a4a,#ff9a3c)}
/* ボスの吹き出し */
.say{position:absolute;left:6px;top:calc(100% + 8px);z-index:4;max-width:calc(100% - 12px);background:var(--card);color:var(--text);font-size:13px;font-weight:800;padding:6px 12px;border-radius:14px;box-shadow:0 4px 14px rgba(80,30,140,.28);opacity:0;transform:translateY(-4px) scale(.95);transform-origin:20px 0;transition:opacity .18s,transform .18s;pointer-events:none}
.say::before{content:"";position:absolute;left:20px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:var(--card)}
.say.on{opacity:1;transform:none}
.dmg{position:absolute;left:64px;right:0;top:8px;text-align:center;font-size:22px;font-weight:900;color:#ff4a4a;text-shadow:0 2px 8px rgba(0,0,0,.3);opacity:0;pointer-events:none}
.dmg.crit{color:var(--gold);font-size:24px}
.dmg.go{animation:pop .7s ease-out}
#flash{position:fixed;inset:0;background:#ff0033;opacity:0;pointer-events:none;z-index:20}
#flash.go{animation:flash .35s}
@keyframes flash{30%{opacity:.35}}
.bigshake{animation:bsh .45s}
@keyframes bsh{15%{transform:translate(-14px,6px)}30%{transform:translate(12px,-8px)}45%{transform:translate(-10px,4px)}60%{transform:translate(8px,-4px)}80%{transform:translate(-4px,2px)}}
/* 問題カード */
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:10px}
#fev{position:absolute;top:0;left:0;right:0;text-align:center;font-size:26px;font-weight:900;color:#fff;letter-spacing:.05em;text-shadow:0 2px 12px rgba(0,0,0,.35);animation:pulse .4s ease-in-out infinite alternate;z-index:2;pointer-events:none}
@keyframes pulse{to{transform:scale(1.12)}}
.card{position:relative;width:100%;max-width:420px;height:100%;max-height:320px;background:var(--card);border-radius:30px;box-shadow:0 18px 50px rgba(80,30,140,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;will-change:transform}
.card.hit{box-shadow:0 0 0 6px var(--ok),0 18px 50px rgba(80,30,140,.28)}
.card.miss{box-shadow:0 0 0 6px var(--ng),0 18px 50px rgba(80,30,140,.28)}
.card.weakfx{animation:wk .5s}
@keyframes wk{30%{transform:scale(.92) rotate(-2deg);box-shadow:0 0 0 8px #a855f7,0 0 40px #a855f7}}
.weak{position:absolute;top:12px;right:12px;border:0;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:900;color:#fff;background:linear-gradient(90deg,#a855f7,#6d28d9);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.weak:disabled{opacity:.35;cursor:default}
.weak b{background:rgba(255,255,255,.25);border-radius:99px;padding:0 6px;margin-left:2px}
#eq{text-align:center;font-weight:900;line-height:1.2;padding:22px 12px 0;width:100%}
#eqQ{font-size:clamp(30px,9vw,44px);font-variant-numeric:tabular-nums;margin-bottom:8px}
#eqQ.s{font-size:clamp(24px,7vw,34px)}
#eqQ.xs{font-size:clamp(19px,5.6vw,27px)}
#eqQ .op{margin:0 .2em}
#eqQ sup{font-size:.55em}
#eqQ .fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.66em;line-height:1.08;text-align:center;margin:0 .06em}
#eqQ .fr span:first-child{border-bottom:.09em solid currentColor;padding:0 .12em}
#eqQ .tk{transition:opacity .35s,color .35s,text-shadow .35s}
#eqQ.dim .tk{opacity:.22}
#eqQ.dim .hl .tk{opacity:1;color:#ff2d8f;text-shadow:0 0 6px #ff2d8f,0 0 18px #ff7ac0}
#eqQ.dim .tk.hs{opacity:1;color:var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 18px var(--cyan)}
#eqR{font-size:clamp(44px,14vw,64px);color:var(--pink);font-variant-numeric:tabular-nums}
#eqR .ph{opacity:.3;animation:blink 1s steps(2) infinite}
#eqR.rev{color:var(--ng);font-size:clamp(30px,9vw,44px)}
@keyframes blink{50%{opacity:.08}}
.hint{position:absolute;bottom:14px;font-size:12px;color:var(--sub)}
#pop{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:42px;font-weight:900;color:var(--gold);text-shadow:0 3px 14px rgba(0,0,0,.35);opacity:0;pointer-events:none;z-index:3}
#pop.go{animation:pop .6s ease-out}
#spd{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:26px;font-weight:900;color:#00b8ff;text-shadow:0 3px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none}
#spd.go{animation:pop .75s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-60px) scale(1)}}
/* テンキー */
footer{display:flex;flex-direction:column;align-items:center;margin-top:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:420px}
.key{height:clamp(50px,8.2vh,66px);border:0;border-radius:18px;font-size:30px;font-weight:900;background:var(--card);color:var(--text);cursor:pointer;box-shadow:0 5px 0 rgba(80,30,140,.2);touch-action:manipulation;font-variant-numeric:tabular-nums}
.key.on{animation:puni .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes puni{0%{transform:scale(.86) translateY(3px);box-shadow:0 2px 0 rgba(80,30,140,.2)}55%{transform:scale(1.06)}100%{transform:none}}
/* 押したキーからふわっと浮かぶハートやキラキラ */
.kp{position:fixed;pointer-events:none;font-size:18px;z-index:6;animation:kp .7s ease-out forwards}
@keyframes kp{from{transform:translate(-50%,-50%) scale(.5);opacity:1}to{transform:translate(calc(-50% + var(--dx)),-95px) scale(1.15);opacity:0}}
.key.neg{color:var(--pink)}
.key.fn{color:var(--sub);font-size:24px}
/* 画面いっぱいの画面 */
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:linear-gradient(160deg,var(--bg1),var(--bg2));padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:10}
.ov h1{margin:0;font-size:clamp(40px,13vw,60px);line-height:1.05;font-weight:900}
.ov h1 em{font-style:normal;color:var(--pink)}
.ov p{margin:0;max-width:340px;color:var(--sub);line-height:1.6}
.topbtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;border:0;border-radius:99px;padding:9px 16px;font-size:15px;font-weight:800;background:var(--card);color:var(--text);cursor:pointer;box-shadow:0 4px 0 rgba(80,30,140,.18);z-index:3}
.topbtn.l{right:auto;left:16px}
.cta{border:0;border-radius:99px;padding:16px 40px;font-size:21px;font-weight:900;color:#fff;background:linear-gradient(90deg,var(--pink),#ff7a3c);cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.cta.line{background:#06c755}
.cta.alt{background:none;color:var(--sub);box-shadow:none;font-size:15px;padding:6px}
.cta.ghost{background:var(--card);color:var(--pink);box-shadow:0 8px 0 rgba(80,30,140,.18)}
/* オープニング */
#open{overflow:hidden}
.fl{position:absolute;font-weight:900;color:var(--pink);opacity:.13;pointer-events:none;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(200deg)}}
.logo{position:relative;animation:boing .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes boing{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:none}}
#open h1{font-size:clamp(44px,14vw,84px);white-space:nowrap}
#open .tag{font-size:18px;font-weight:800;color:var(--text);animation:up .6s .5s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.opbtns{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px;margin-top:18px;animation:up .6s .8s both}
.opbtns .cta{width:100%}
.note{font-size:12px!important}
/* 登録・ログイン */
.form{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px;text-align:left}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px}
.form input{font:inherit;font-size:18px;padding:13px 16px;border-radius:16px;border:2px solid transparent;background:var(--card);color:var(--text);-webkit-user-select:text;user-select:text;outline:none}
.form input:focus{border-color:var(--pink)}
.pw{position:relative;display:flex}
.pw input{flex:1;min-width:0;padding-right:54px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:12px;background:none;font-size:20px;cursor:pointer;opacity:.45}
.pw button[aria-pressed="true"]{opacity:1}
.form small{font-weight:400;color:var(--sub);font-size:12px}
.form .cta{margin-top:6px}
.form .cta:disabled{opacity:.6}
.err{color:var(--ng)!important;font-weight:800;min-height:1.6em;font-size:14px}
/* ワールドマップ */
#map{justify-content:flex-start;gap:10px;padding-top:calc(66px + env(safe-area-inset-top,0px));padding-left:16px;padding-right:16px}
#map .oya{width:100%;max-width:420px;margin:0;background:var(--card);border-radius:16px;padding:9px 12px}
.wnav{display:flex;align-items:center;gap:8px;width:100%;max-width:420px}
.wbtn{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--card);color:var(--text);font-size:16px;cursor:pointer;box-shadow:0 3px 0 rgba(80,30,140,.18)}
.wbtn:disabled{opacity:.3}
.wt{flex:1}
.wt small{display:block;font-size:12px;font-weight:900;letter-spacing:.15em;color:var(--sub)}
.wt b{font-size:22px}
.mapbox{position:relative;flex:1;width:100%;max-width:420px;min-height:280px;border-radius:28px;overflow:hidden;box-shadow:0 14px 40px rgba(80,30,140,.25)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.mapbox .deco{position:absolute;font-size:34px;opacity:.35;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:var(--pink);color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;padding:0}
.node.mid{width:68px;height:68px;font-size:30px;background:#ff7a3c}
.node.big{width:84px;height:84px;font-size:40px;background:#7a3cff}
.node.done{background:var(--ok)}
.node.lock{background:#9a96b5;cursor:default;font-size:20px}
.node.now{animation:now 1s ease-in-out infinite alternate}
@keyframes now{to{box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 0 10px rgba(255,255,255,.55)}}
.node .st{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:13px;color:#ffe14d;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;letter-spacing:-1px}
.wlock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,40,.45);color:#fff;font-weight:900;font-size:16px;padding:20px}
.wdesc{font-size:13px}
.sheet{position:fixed;inset:0;background:rgba(20,10,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet .in{width:100%;max-width:520px;background:var(--card);border-radius:28px 28px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;animation:up .2s both}
.sheet .no{font-size:13px;font-weight:900;letter-spacing:.15em;color:var(--sub)}
.sheet h2{margin:0;font-size:26px}
.sheet .bemo{font-size:56px}
.sheet p{font-size:14px}
.sheet .cta{width:100%;max-width:320px;margin-top:6px}
/* 名前メニューとランク */
#who small{margin-left:6px;font-size:12px;color:#fff;background:var(--pink);border-radius:99px;padding:2px 8px}
.umenu{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:16px;z-index:4;width:min(300px,calc(100% - 32px));background:var(--card);border-radius:22px;padding:16px;box-shadow:0 14px 40px rgba(80,30,140,.3);text-align:left;animation:up .18s both}
.rank{display:flex;gap:14px;align-items:center}
.rank .rk{flex:none;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:conic-gradient(from 200deg,var(--pink),var(--gold),#7a3cff,var(--pink));box-shadow:inset 0 0 0 5px rgba(255,255,255,.35)}
.rank .rk span{font-size:10px;font-weight:800;letter-spacing:.1em}
.rank .rk b{font-size:30px;line-height:1}
.rank .ti{flex:1;min-width:0}
.rank .ti b{display:block;font-size:17px}
.rank .bar{margin:6px 0 4px}
.rank small{font-size:12px;color:var(--sub)}
.umenu .how{font-size:11px;color:var(--sub);margin:10px 0 4px;line-height:1.5}
.umenu .item{display:block;width:100%;border:0;border-top:1px solid rgba(127,127,160,.2);background:none;color:var(--text);font-size:16px;font-weight:800;text-align:left;padding:13px 4px;cursor:pointer}
.umenu .item.out{color:var(--ng)}
/* 記録 */
#rec{justify-content:flex-start;overflow-y:auto;padding-top:calc(64px + env(safe-area-inset-top,0px))}
#rec h1{font-size:clamp(32px,10vw,44px)}
.recs{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px}
.rec{background:var(--card);border-radius:18px;padding:12px 14px;text-align:left}
.rec .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:8px}
.rec .tag{font-size:12px;color:#fff;border-radius:99px;padding:2px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.basic,.tag.w1{background:#10b968}.tag.mid,.tag.w2{background:#ff6a3c}.tag.high,.tag.w3{background:#5a6cff}.tag.w4{background:#0f9f8f}.tag.w5{background:#7a3cff}
.rec .row{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.rec .row b{display:block;font-size:clamp(15px,4.6vw,19px);white-space:nowrap;font-variant-numeric:tabular-nums}
.rec .row span{font-size:11px;color:var(--sub)}
/* 結果：スクショしたくなる認定証カード */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.cert{width:100%;max-width:340px;padding:3px;border-radius:26px;background:conic-gradient(from var(--a),#ff2d8f,#ffb300,#7afcff,#b46bff,#ff2d8f);animation:spin 3s linear infinite;box-shadow:0 14px 40px rgba(180,60,200,.3)}
@keyframes spin{to{--a:360deg}}
.cin{position:relative;overflow:hidden;background:var(--card);border-radius:23px;padding:14px 16px 12px;text-align:center}
.cin::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);animation:shine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.ctop{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.05em;white-space:nowrap}
.ctop span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cname{font-size:15px;font-weight:900;margin-top:6px}
.ctitle{font-size:clamp(20px,6.4vw,26px);font-weight:900;line-height:1.2;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.cin .stars{font-size:30px;min-height:0;margin:2px 0}

<script>
/* ---------- 出題エンジン（式の木を作って、計算・表示・ヒント・弱体化に使う） ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

// 分数で正確に計算する（小数も分数として持つので誤差が出ない）
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const Q=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}};
const QOP={"+":(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d),"−":(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d),"×":(a,b)=>Q(a.n*b.n,a.d*b.d),"÷":(a,b)=>Q(a.n*b.d,a.d*b.n)};
const qpow=(a,e)=>Q(a.n**e,a.d**e);

// 式の木。n=数 b=二項演算 p=かっこ w=累乗 u=先頭のマイナス（−4² の −）
const I=(v,plus)=>({t:"n",v:Q(v),f:"i",plus:!!plus&&v>0});
const S=v=>I(v,true);                       // 正の数にも＋を付ける（(+3) 表記）
const Ib=v=>({...I(v),bare:true});           // 式や（）の先頭のマイナスはカッコなしで書く（−4 + 7）
const D=(t,den=10)=>({t:"n",v:Q(t,den),f:"d"});  // 小数。D(12)=1.2
const F=(n,d)=>{const v=Q(n,d);return v.d===1?I(v.n):{t:"n",v,f:"f"}};
const FQ=q=>F(q.n,q.d);
const Fb=(n,d)=>({...F(n,d),bare:true});
const B=(op,l,r)=>({t:"b",op,l,r});
const P=e=>({t:"p",e});
const W=(b,e)=>({t:"w",b,e});
const U=e=>({t:"u",e});
const add=(l,r)=>B("+",l,r),sub=(l,r)=>B("−",l,r),mul=(l,r)=>B("×",l,r),div=(l,r)=>B("÷",l,r);

function ev(x){
  switch(x.t){
    case "n":return x.v;
    case "b":{const r=ev(x.r);if(x.op==="÷"&&r.n===0)throw new Error("÷0");return QOP[x.op](ev(x.l),r)}
    case "p":return ev(x.e);
    case "w":return qpow(ev(x.b),x.e);
    case "u":{const v=ev(x.e);return Q(-v.n,v.d)}
  }
}

// 見た目どおりに計算されるよう、必要な所にだけかっこを足す。ついでに番号を振る
const prec=x=>x.t==="b"?(x.op==="+"||x.op==="−"?1:2):9;
function norm(x,ctr={i:0}){
  let y;
  if(x.t==="b"){
    let l=norm(x.l,ctr),r=norm(x.r,ctr);
    if(prec(l)<prec(x))l=wrap(l,ctr);
    if(prec(r)<prec(x)||(prec(r)===prec(x)&&(x.op==="−"||x.op==="÷"))||lead(r).t==="u")r=wrap(r,ctr);
    y={...x,l,r};
  }else if(x.t==="p")y={...x,e:norm(x.e,ctr)};
  else if(x.t==="w"){let b=norm(x.b,ctr);if(b.t==="b"||b.t==="u")b=wrap(b,ctr);y={...x,b}}
  else if(x.t==="u")y={...x,e:norm(x.e,ctr)};
  else y={...x};
  y.id=ctr.i++;return y;
}
const lead=x=>x.t==="b"?lead(x.l):x;  // 式のいちばん左にあるもの
const wrap=(e,ctr)=>({t:"p",e,id:ctr.i++});

// 小数の表示。分母が10・100…で割り切れる形に直して小数点を入れる
const decStr=q=>{let k=0;while(10**k%q.d&&k<6)k++;const s=String(Math.abs(q.n)*(10**k/q.d)).padStart(k+1,"0");
  return (q.n<0?"-":"")+(k?s.slice(0,-k)+"."+s.slice(-k):s)};

// 表示用HTML。全部の文字を .tk で包んで、ヒントで光らせたり暗くしたりできるようにする
function html(x){
  const tk=(s,c="")=>`<span class="tk${c}">${s}</span>`;
  const nd=(x,inner)=>`<span class="nd" data-i="${x.id}">${inner}</span>`;
  switch(x.t){
    case "n":{
      const a=Math.abs(x.v.n),body=x.f==="f"?`<span class="tk fr"><span>${a}</span><span>${x.v.d}</span></span>`:tk(x.f==="d"?decStr(Q(a,x.v.d)):a);
      if(x.v.n<0)return nd(x,x.bare?tk("−"," sg")+body:tk("(")+tk("−"," sg")+body+tk(")"));
      if(x.plus)return nd(x,tk("(")+tk("+"," sg")+body+tk(")"));
      return nd(x,body);
    }
    case "b":return nd(x,html(x.l)+`<span class="tk op" data-o="${x.id}">${x.op}</span>`+html(x.r));
    case "p":return nd(x,tk("(")+html(x.e)+tk(")"));
    case "w":{const b=x.b,fr=b.t==="n"&&b.f==="f"&&b.v.n>0&&!b.plus;
      return nd(x,(fr?tk("("):"")+html(b)+(fr?tk(")"):"")+`<sup class="tk">${x.e}</sup>`)}
    case "u":return nd(x,tk("−"," sg")+html(x.e));
  }
}
function text(x){
  switch(x.t){
    case "n":{const a=Math.abs(x.v.n),body=x.f==="f"?a+"/"+x.v.d:x.f==="d"?decStr(Q(a,x.v.d)):String(a);
      return x.v.n<0?(x.bare?"−"+body:"(−"+body+")"):x.plus?"(+"+body+")":body}
    case "b":return text(x.l)+" "+x.op+" "+text(x.r);
    case "p":return "("+text(x.e)+")";
    case "w":{const b=x.b,fr=b.t==="n"&&b.f==="f"&&b.v.n>0&&!b.plus;return (fr?"("+text(b)+")":text(b))+"^"+x.e}
    case "u":return "−"+text(x.e);
  }
}

// ヒント：最初に計算すべき塊（かっこ → 累乗 → 乗除 → 左の加減）と、ぶつかっている符号
const kids=x=>x.t==="b"?[x.l,x.r]:x.t==="p"||x.t==="u"?[x.e]:x.t==="w"?[x.b]:[];
const hasOp=x=>x.t==="b"||x.t==="w"||x.t==="u";
function findPar(x){if(x.t==="p"&&hasOp(x.e))return findPar1(x.e)||x;return findPar1(x)}
function findPar1(x){for(const c of kids(x)){const r=findPar(c);if(r)return r}return null}
function findPow(x){if(x.t==="w")return x;for(const c of kids(x)){const r=findPow(c);if(r)return r}return null}
function findMul(x,inMul){const m=x.t==="b"&&(x.op==="×"||x.op==="÷");if(m&&!inMul)return x;for(const c of kids(x)){const r=findMul(c,m);if(r)return r}return null}
function findAdd(x){if(x.t!=="b")return null;return findAdd(x.l)||x}
function chunk(root){
  const p=findPar(root);
  if(p)return chunk(p.e)||p;  // かっこの中にも順番があれば、中の最初の塊まで絞る
  const c=findPow(root)||findMul(root,false)||findAdd(root);
  return c&&c!==root?c:null;
}
function clashes(x,out=[]){
  if(x.t==="b"&&(x.op==="+"||x.op==="−")&&x.r.t==="n"&&(x.r.v.n<0||x.r.plus))out.push([x.id,x.r.id]);
  kids(x).forEach(c=>clashes(c,out));return out;
}

/* ---------- 乱数係：弱体化のとき、形の選び方は同じまま数字だけ小さくする ---------- */
function Gen(L,replay){
  const ch=[];let i=0;
  return{
    L,ch,weak:!!replay,
    c(k){const v=replay?(i<replay.length?replay[i++]:0)%k:rnd(0,k-1);if(!replay)ch.push(v);return v},
    s(){return this.c(2)?-1:1},
    op(){return this.c(2)?"−":"+"},
    pick(a){return a[this.c(a.length)]},
    k(...a){return a[Math.min(L,a.length-1)]},
    n(lo,hi){if(replay){const l=Math.min(lo,2);return rnd(l,Math.max(l,Math.min(hi,2)))}return rnd(lo,Math.max(lo,hi))}  // 弱体化は1か2だけ
  };
}
const nzd=(g,lo,hi,d)=>{let t=g.n(lo,hi);while(gcd(t,d)>1)t+=1;return t};  // d と約分できない数（分数がきれいに残るように）
const opj=(op,l,r)=>B(op,l,r);
const nb=(g,lo,hi)=>Ib(g.s()*g.n(lo,hi));  // 先頭用：マイナスならカッコなし
const sgn=(g,lo,hi)=>I(g.s()*g.n(lo,hi));   // 2つ目以降：マイナスならカッコ付き
// 必ずマイナスが入る掛け算。one=true なら片方だけ、false なら両方マイナスもある
const negPair=(g,one)=>[[-1,1],[1,-1],[-1,-1]][g.c(one?2:3)];
const big=g=>g.k(5,7,9);  // 1桁の中での上限。最初は5まで、ステージ後半やボスのHPが減ると7、9まで解禁
function mul99(g,one){const [sa,sb]=negPair(g,one);return mul(I(sa*g.n(2,big(g))),I(sb*g.n(2,big(g))))}
// World 4 用の小さい掛け算（1〜4の段）と割り算
const mulS=g=>mul(sgn(g,2,g.k(3,4,4)),sgn(g,1,g.k(3,4,4)));
const divS=g=>{const b=g.s()*g.n(2,g.k(3,4,4)),q=g.s()*g.n(1,g.k(3,4,4));return div(I(b*q),I(b))};

/* 暗算の重さで手が止まらないよう、World 1〜2 は最後まで1桁、World 3〜5 も小さい数だけ。
   そのかわり L（0→1→2）で使う数の上限を上げて、ステージの後半ほど手応えが出るようにする */
const T={
  // World 1 マイナスの草原：カッコなし・1桁
  a1_negans:{n:"答えがマイナスになる引き算",f:g=>{const a=g.n(1,g.k(4,6,8));return sub(I(a),I(g.n(a+1,Math.max(a+1,big(g)))))}},
  a1_negstart:{n:"マイナスから始まる計算",f:g=>opj(g.op(),Ib(-g.n(1,big(g))),I(g.n(1,big(g))))},
  a1_rush:{n:"2つの数の加減ラッシュ",f:g=>opj(g.op(),nb(g,1,big(g)),I(g.n(2,big(g))))},
  a1_three:{n:"3つの数の加減",f:g=>opj(g.op(),opj(g.op(),I(g.n(1,big(g))),I(g.n(1,big(g)))),I(g.n(1,big(g))))},
  a1_threeneg:{n:"マイナスから始まる3つの数の加減",f:g=>opj(g.op(),opj(g.op(),Ib(-g.n(1,big(g))),I(g.n(1,big(g)))),I(g.n(1,big(g))))},
  a1_long:{n:"3つの数の加減ラッシュ",f:g=>{const h=g.k(4,5,6);return opj(g.op(),opj(g.op(),nb(g,1,h),I(g.n(1,h))),I(g.n(1,h)))}},
  // World 2 カッコの迷宮：1桁。教科書どおり正の数も (+4) と書く
  a2_same:{n:"同じ符号のカッコ付き足し算",f:g=>{const s=g.s();return add(S(s*g.n(1,big(g))),S(s*g.n(1,big(g))))}},
  a2_diff:{n:"ちがう符号のカッコ付き足し算",f:g=>{const s=g.s();return add(S(s*g.n(1,big(g))),S(-s*g.n(1,big(g))))}},
  a2_addsub:{n:"カッコ付きの足し算・引き算",f:g=>{const k=g.c(3),x=S(g.s()*g.n(1,big(g))),y=g.n(1,big(g));
    return k===0?add(x,S(y)):k===1?add(x,I(-y)):sub(x,S(y))}},
  a2_subneg:{n:"マイナスを引く計算",f:g=>sub(sgn(g,1,big(g)),I(-g.n(1,big(g))))},
  a2_mul1:{n:"カッコ付きの掛け算（片方がマイナス）",f:g=>{const a=g.n(2,g.k(3,4,5)),b=g.n(2,g.k(3,4,5));return g.c(2)?mul(I(-a),I(b)):mul(I(b),I(-a))}},
  a2_mul2:{n:"カッコ付きの掛け算（1〜5の段）",f:g=>{const [sa,sb]=negPair(g,false);return mul(I(sa*g.n(2,g.k(3,4,5))),I(sb*g.n(2,g.k(3,4,5))))}},
  // World 3 反転の火山
  a3_mul1:{n:"正負の掛け算（片方がマイナス）",f:g=>mul99(g,true)},
  a3_mul2:{n:"正負の掛け算（九九ぜんぶ）",f:g=>mul99(g,false)},
  a3_div:{n:"九九の逆で解く割り算",f:g=>{const [sd,sb]=negPair(g,false),b=g.n(2,big(g));return div(I(sd*b*g.n(2,big(g))),I(sb*b))}},  // 割られる数か割る数に必ずマイナス
  a3_md0:{n:"掛け算・割り算のミックスと0",f:g=>{switch(g.c(5)){
    case 0:case 1:return mul99(g,false);
    case 2:case 3:{const b=g.s()*g.n(2,big(g)),q=g.s()*g.n(1,big(g));return div(I(b*q),I(b))}
    default:switch(g.c(3)){case 0:return div(I(0),sgn(g,2,big(g)));case 1:return mul(I(0),sgn(g,2,big(g)));default:return mul(sgn(g,2,big(g)),I(0))}}}},  // 0の計算は5回に1回くらい
  a3_pow:{n:"2乗の基礎",f:g=>{const a=g.n(2,g.k(3,4,5));switch(g.c(3)){case 0:return W(I(-a),2);case 1:return U(W(I(a),2));default:return W(I(a),2)}}},
  a3_three:{n:"簡単な3つの掛け算",f:g=>{const h=g.k(2,3,3);return mul(mul(sgn(g,1,h),sgn(g,2,h)),sgn(g,2,h))}},
  // World 4 四則の要塞：掛け算は1〜4の段、足し引きは1〜5。計算の順番だけに集中
  a4_mulplus:{n:"掛け算が先頭（足し算つき）",f:g=>add(mulS(g),sgn(g,1,g.k(3,4,5)))},
  a4_mulminus:{n:"掛け算が先頭（引き算つき）",f:g=>sub(mulS(g),sgn(g,1,g.k(3,4,5)))},
  a4_mulback:{n:"掛け算が後ろの混合式",f:g=>opj(g.op(),sgn(g,1,g.k(3,4,5)),mulS(g))},
  a4_div:{n:"割り算が先頭の混合式",f:g=>opj(g.op(),divS(g),sgn(g,1,g.k(3,4,5)))},
  a4_divback:{n:"割り算が後ろの混合式",f:g=>opj(g.op(),sgn(g,1,g.k(3,4,5)),divS(g))},
  a4_par:{n:"カッコの中を先に計算する四則混合",f:g=>{const op=g.op(),a=nb(g,1,g.k(3,4,5));let b=g.n(1,g.k(3,4,5));
    if(a.v.n===(op==="−"?b:-b))b+=1;  // カッコの中が0にならないように
    const inner=P(opj(op,a,I(b))),m=sgn(g,2,g.k(3,4,4));
    return g.c(2)?mul(inner,m):mul(m,inner)}},
  // World 5 魔王の城：分母は2〜5だけ
  a5_fplus:{n:"同じ分母の分数の足し算",f:g=>{const d=g.n(2,g.k(3,4,5)),a=nzd(g,1,d-1,d),R=g.n(1,g.k(1,2,2));
    return g.c(2)?add(F(R*d+a,d),F(-a,d)):add(Fb(-a,d),F(R*d+a,d))}},          // 7/2 + (−3/2) ／ −1/3 + 4/3
  a5_fminus:{n:"同じ分母の分数の引き算",f:g=>{const d=g.n(2,g.k(3,4,5)),a=nzd(g,1,d-1,d),R=g.n(1,g.k(1,2,2));
    return g.c(2)?sub(Fb(-a,d),F(R*d-a,d)):sub(F(R*d+a,d),F(a,d))}},          // −1/3 − 5/3 ／ 7/3 − 1/3
  a5_fmul:{n:"分母がスパッと消える分数の掛け算",f:g=>{const d=g.n(2,g.k(3,4,5)),a=nzd(g,1,g.k(2,3,4),d),f=F(g.s()*a,d),N=I(g.s()*d*g.n(1,g.k(1,2,2)));
    return g.c(2)?mul(f,N):mul(N,f)}},
  a5_fdiv:{n:"逆数にして約分する分数の割り算",f:g=>{const d=g.n(2,g.k(3,4,5)),a=nzd(g,2,g.k(3,4,4),d);
    if(g.c(2))return div(I(g.s()*a*g.n(1,g.k(1,2,2))),F(g.s()*a,d));   // (−4) ÷ 2/3
    const R=g.s()*(a>3?2:g.n(2,g.k(2,3,3))),f2=Q(g.s()*a,d);  // 分子が12をこえないように
    return div(FQ(QOP["×"](Q(R),f2)),FQ(f2))}},  // (−4/5) ÷ (−2/5)
  a5_final:{n:"全ワールドのまとめ",f:g=>{const a=g.n(2,g.k(3,4,4)),pw=g.c(2)?W(I(-a),2):U(W(I(a),2)),m=mulS(g);
    return g.c(2)?opj(g.op(),pw,m):opj(g.op(),m,pw)}}                  // (−2)² − (−3) × 2
};

// 1問つくる。答えが整数でなかったり、出たことのある式なら作り直す
function build(tpl,L,replay){
  const g=Gen(L,replay),raw=T[tpl].f(g),v=ev(raw);
  if(v.d!==1||Math.abs(v.n)>9999)return null;
  const ast=norm(raw);
  return{tpl,L,ch:g.ch,ast,text:text(ast),ans:v.n,weak:!!replay};
}
function makeQ(tpls,L,seen){
  for(let i=0;i<80;i++){
    const t=tpls[i<40?rnd(0,tpls.length-1):i%tpls.length];
    let q=null;try{q=build(t,L)}catch(e){}
    if(q&&!seen.has(q.text))return q;
  }
  return build(tpls[0],L);
}
// 数字だけ消した骨組み。符号やかっこの並びが同じかどうかを比べる
const shape=t=>t.replace(/\d+(\.\d+)?(\/\d+)?/g,"#");
function weaken(q){
  let any=null;
  for(let i=0;i<80;i++){let w=null;try{w=build(q.tpl,q.L,q.ch)}catch(e){}
    if(!w||w.text===q.text)continue;if(shape(w.text)===shape(q.text))return w;any=any||w}
  return any;
}

/* ---------- 音 ---------- */
let ac;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==="suspended")ac.resume();
}
function tone(f,d,type,v,when){
  if(!ac||muted)return;
  const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(when||0);
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d);
}
function sfxOk(c){
  const f=660*Math.pow(1.0595,Math.min(c,12));
  tone(f,.12,"triangle",.22);tone(f*1.5,.18,"sine",.18,.07);tone(f*2,.25,"square",.05,.14);
  if(c>0&&c%5===0){[1,1.25,1.5,2].forEach((m,i)=>tone(523*m,.3,"sawtooth",.07,i*.08))}
}
function sfxNg(){tone(160,.25,"sawtooth",.14);tone(110,.3,"sawtooth",.14,.12)}
function sfxCrit(){tone(90,.35,"square",.2);tone(1400,.15,"sawtooth",.08,.02);tone(1900,.2,"triangle",.1,.08)}
function sfxHint(){tone(1320,.08,"sine",.08);tone(1760,.12,"sine",.07,.07)}
function sfxWin(){[1,1.25,1.5,2,2.5].forEach((m,i)=>tone(523*m,.35,"triangle",.12,i*.1))}

/* ---------- 制限時間：3秒でヒント、時間切れでハートが減って次の問題へ ---------- */
function tick(){
  if(!running)return;
  tRaf=requestAnimationFrame(tick);
  if(busy)return;
  const lim=LIMIT[sw],dt=(performance.now()-t0)/1000,left=Math.max(0,1-dt/lim),bar=$("#tBar");
  bar.style.transform=`scaleX(${left})`;
  bar.className=dt<QUICK?"":left>.25?"mid":"low";
  if(dt>=QUICK&&!typed)showHint();
  if(dt>=lim)timeUp();
}

/* ---------- 救済①：3秒入力がなければ、最初に計算する塊とぶつかる符号を光らせる ---------- */
// 光らせた場所に合わせて、何から計算すればいいかを一言で
function hintText(c,cl){
  if(!c)return "水色の符号に注目！ ＋と−がぶつかってるよ";
  if(c.t==="p")return "💡 光っているカッコの中から計算してみて！";
  if(c.t==="w")return "💡 光っている2乗から計算してみて！";
  if(c.op==="×"||c.op==="÷")return "💡 光っている掛け算・割り算から先に計算してみて！";
  return "💡 光っている左の2つから計算してみて！";
}
function showHint(){
  if(!running||busy||hlOn)return;
  hlOn=true;
  if(kind!=="normal")say(SAY.idle);
  const c=chunk(q.ast),cl=clashes(q.ast),el=$("#eqQ");
  if(!c&&!cl.length)return;
  el.classList.add("dim");
  if(c)el.querySelector(`[data-i="${c.id}"]`).classList.add("hl");
  $("#hint").textContent=hintText(c,cl);
  // 塊（ピンク）があるときは、その中でぶつかる符号だけ水色にして、目線がばらけないようにする
  const box=c&&el.querySelector(`[data-i="${c.id}"]`);
  cl.forEach(([o,l])=>{const op=el.querySelector(`[data-o="${o}"]`);if(box&&!box.contains(op))return;
    op.classList.add("hs");el.querySelector(`[data-i="${l}"] .sg`).classList.add("hs")});
  sfxHint();
}

/* ---------- 救済②：弱体化。式の形はそのまま、数字だけ小さく ---------- */
$("#weak").onclick=()=>{
  if(!running||busy||weakLeft<=0||q.weak)return;
  audio();
  const w=weaken(q);
  if(!w){pop("もう最弱だよ🧪");return}  // もとから一番小さい数のときは回数を使わない
  weakLeft--;q=w;
  card.classList.remove("weakfx");void card.offsetWidth;card.classList.add("weakfx");
  tone(500,.15,"sine",.12);tone(300,.25,"sine",.1,.1);
  pop("🧪 弱体化！");showQ();
};

function press(k){
  if(busy||!running)return;
  audio();
  if(k==="C"){typed="";draw();return}
  if(k==="-"){if(typed)return;typed="-"}else typed+=k;
  const want=String(q.ans);
  if(!want.startsWith(typed)){miss();return}  // 1文字でもズレたら即ミス
  tone(900,.04,"sine",.07);
  if(typed===want)correct();else draw();
}
function correct(){
  busy=true;draw();card.classList.add("hit");
  const dt=(performance.now()-t0)/1000,quick=dt<=QUICK,sp=quick?1.5:1;
  okN++;done++;pts+=fever>0?2:1;combo++;maxCombo=Math.max(maxCombo,combo);tSum+=dt;
  // FEVER中に正解した分がクリティカル（2倍）
  const crit=fever>0;
  score+=Math.round((crit?20:10)*sp);
  if(quick)pop(`⚡ ${dt.toFixed(1)}秒！ ×1.5`,"#spd");
  if(kind!=="normal"){
    const dmg=Math.round(BASE_DMG*(1+.1*(combo-1))*(crit?2:1)*sp);
    hp-=dmg;fx($("#bEmo"),"hit");
    const d=$("#dmg");d.textContent=(crit?"CRITICAL!! ":"")+"−"+dmg;d.classList.toggle("crit",crit);fx(d,"go");
    if(crit){fx($("#app"),"bigshake");sfxCrit();if(navigator.vibrate)navigator.vibrate([20,20,40])}
    if(hp>0)say(crit?pick1(SAY.crit):pick1([foe.ow,...SAY.hurt]));
  }
  if(combo%5===0){fever=5;pop("FEVER!!")}else{if(fever>0)fever--;if(!crit||kind==="normal")pop(WORDS[rnd(0,WORDS.length-1)])}
  if(kind!=="normal"&&hp<=0){hud();sfxOk(combo);burst();$("#bEmo").classList.add("dead");pop("撃破！！");say(SAY.lose,1200);later(()=>finish("clear"),900);return}
  sfxOk(combo);burst();
  if(navigator.vibrate)navigator.vibrate(12);
  hud();
  later(()=>{if(kind==="normal"&&done>=NORMAL_N){finish("clear");return}nextQ();busy=false},100);
}
// まちがい・時間切れの共通処理。ハートが1つ減ってコンボが切れる。ボス戦で0になったら負け
function hurt(){
  misses++;tplMiss[q.tpl]=(tplMiss[q.tpl]||0)+1;
  combo=0;fever=0;hearts=Math.max(0,hearts-1);sfxNg();
  card.classList.remove("hit");card.classList.add("miss");
  fx($("#stage"),"shake");if(navigator.vibrate)navigator.vibrate([30,30,30]);
  if(kind!=="normal"){fx($("#bEmo"),"atk");fx($("#flash"),"go");say(hearts>0?pick1(SAY.taunt):SAY.win)}
  hud();
  if(kind!=="normal"&&hearts<=0){later(()=>finish("lose"),700);return true}
  return false;
}
function miss(){
  busy=true;

  // まちがえた最後の1文字だけ消す。合っていた所（−1 など）は残して、そこから打ち直せる
  typed=typed.slice(0,-1);

  later(()=>{draw();card.classList.remove("miss");busy=false},350);
}

/* ---------- 🔥 連続記録：遊んだ日が今日（または昨日）までつながっている日数 ---------- */

function streak(){
  const days=new Set(myRecs.map(r=>dayKey(r.at)));

  if(!today)d.setDate(d.getDate()-1);   // 今日まだでも、昨日までの記録は切れていない

function setUser(u){

  me=u;myRecs=[];myXp=0;myProg={};
  loadP=u?Promise.all([cloud.listRecords(),cloud.getProfile()]).then(([l,p])=>{
    if(me!==u)return;
    myRecs=l;myProg=p.prog||{};
    // XPを持っていない人は、今までの記録から計算して保存しておく
    let x=p.xp;if(x==null){x=l.reduce((t,r)=>t+xpOf(r),0);cloud.setXp(x).catch(e=>console.error(e))}

    mapW=0;while(mapW<WORLDS.length-1&&unlocked(mapW+1,0))mapW++;

}
/* ---------- ランク（1〜100） ----------
   XP = スコア × ワールドの重さ × 正解率。スコアには速さボーナス・フィーバー・クリアボーナスが入っている */
const TIERS=["計算デビュー🐣","ゆる計算ちゃん🌱","マイナスなかよし🫧","カッコ攻略中🎀","九九ガチ勢🌶️","計算ちょい盛れ✨","四則インフルエンサー📱","分数マスター🔮","計算のカリスマ💎","計算の女神👑"];
const need=r=>Math.round(30*Math.pow(r-1,1.9));  // ランクrになるのに必要な合計XP。100で約18.6万
const rankOf=x=>{let r=1;while(r<100&&x>=need(r+1))r++;return r};
const COURSE_W={basic:1,mid:1.5,high:2};  // ワールド制より前の記録用
function xpOf(r){
  const w=r.st?1+(+r.st.split("-")[0]-1)*.25:COURSE_W[r.c]||1,m=r.miss??(r.n-r.ok);
  return Math.round(r.score*w*(r.ok+m?r.ok/(r.ok+m):0));
}
let myXp=0;
function drawRank(){
  const r=rankOf(myXp);
  $("#whoN").textContent="👤 "+me.name;$("#whoR").textContent="ランク"+r;
  $("#mRank").textContent=r;$("#mTitle").textContent=TIERS[Math.floor((r-1)/10)];
  const a=need(r),b=need(r+1);
  $("#mBar").style.width=(r>=100?100:(myXp-a)/(b-a)*100)+"%";
  $("#mNext").textContent=r>=100?`最高ランク！ 合計 ${myXp.toLocaleString()} XP`:`次のランクまで ${(b-myXp).toLocaleString()} XP`;
}
let authMode;
function openAuth(m){
  authMode=m;const reg=m==="reg";
  $("#authT").textContent=reg?"新規登録":"ログイン";
  $("#aGo").textContent=reg?"登録してはじめる":"ログインしてはじめる";
  $("#authSwap").textContent=reg?"もう登録してる人はこちら（ログイン）":"はじめての人はこちら（新規登録）";
  $("#aPw").autocomplete=reg?"new-password":"current-password";
  $("#aErr").textContent="";$("#aPw").value="";showPw(false);
  screen("auth");$("#aName").focus();
}
const ERR={
  "auth/email-already-in-use":"その名前はもう使われています。別の名前にしてね",
  "auth/invalid-credential":"名前かパスワードがちがいます",
  "auth/wrong-password":"名前かパスワードがちがいます",
  "auth/user-not-found":"名前かパスワードがちがいます",
  "auth/invalid-email":"名前かパスワードがちがいます",
  "auth/too-many-requests":"失敗が続いたので少し待ってからためしてね",
  "auth/network-request-failed":"ネットにつながっていません"
};
$("#authF").onsubmit=async e=>{
  e.preventDefault();
  const name=$("#aName").value.trim(),pw=$("#aPw").value,reg=authMode==="reg";
  const bad=!name?"名前を入れてね":pw.length<6?"パスワードは6文字以上にしてね":"";
  if(bad){$("#aErr").textContent=bad;return}
  $("#aErr").textContent="";$("#aGo").disabled=true;
  try{
    const u=await(reg?cloud.register(name,pw):cloud.login(name,pw));
    await setUser(u);goMap();
  }catch(err){console.error(err);$("#aErr").textContent=ERR[err.code]||"うまくいきませんでした。もう一度ためしてね"}
  finally{$("#aGo").disabled=false}
};
// 👁️ で入力中のパスワードを見せる（確認用の2回目の入力のかわり）
function showPw(on){$("#aPw").type=on?"text":"password";$("#aEye").setAttribute("aria-pressed",on);$("#aEye").setAttribute("aria-label",on?"パスワードをかくす":"パスワードを表示")}
$("#aEye").onclick=()=>{showPw($("#aPw").type==="password");$("#aPw").focus()};
$("#goReg").onclick=()=>openAuth("reg");
$("#goLogin").onclick=()=>openAuth("login");
$("#goSwitch").onclick=()=>openAuth("login");
$("#authSwap").onclick=()=>openAuth(authMode==="reg"?"login":"reg");
$("#authBack").onclick=()=>screen("open");
$("#goPlay").onclick=()=>{audio();goMap()};
$("#who").onclick=e=>{e.stopPropagation();$("#umenu").hidden=!$("#umenu").hidden};
$("#umenu").onclick=e=>e.stopPropagation();
document.addEventListener("click",()=>$("#umenu").hidden=true);
$("#mRec").onclick=()=>{$("#umenu").hidden=true;showRecs()};
/* ---------- 🎨 着せ替え：星の合計やランクで解放。選んだテーマはこの端末に人ごとに覚える ---------- */
const SKINS={
  base:{n:"ゆめかわピンク🎀",c:["#fff0f7","#ff2d8f","#ffb300"],need:null},
  cafe:{n:"韓国カフェ風ラテ☕",c:["#f7efe6","#c4865b","#e0ad62"],need:{stars:5}},
  sky:{n:"水色界隈・天使系🩵",c:["#eef8ff","#4fb3f0","#b49cff"],need:{stars:12}},
  neon:{n:"ネオンサイバー👾",c:["#0b0b1e","#ff2bd6","#00f0ff"],need:{stars:25}},
  oshi:{n:"推し色（メンカラ）💖",c:["#ff3b5c","#2f80ff","#ffd000"],need:{rank:10}}
};
const OSHI=["#ff3b5c","#ff8a00","#f5c400","#2ecc71","#00bcd4","#2f80ff","#8b5cf6","#ff5fa2"];
const starSum=()=>Object.values(myProg).reduce((t,v)=>t+v,0);
const skinOk=k=>{const n=SKINS[k].need;return !n||(n.stars?starSum()>=n.stars:rankOf(myXp)>=n.rank)};
const skinsOpen=()=>Object.keys(SKINS).filter(skinOk);
const skinKey=()=>"dopamath-skin:"+(me?me.id:"");
function loadSkin(){try{return JSON.parse(localStorage.getItem(skinKey()))||{}}catch(e){return {}}}
function applySkin(){
  const {skin,oshi}=me?loadSkin():{},k=skin&&SKINS[skin]&&skinOk(skin)?skin:"base",r=document.documentElement;
  if(k==="base")r.removeAttribute("data-skin");else r.dataset.skin=k;
  if(oshi)r.style.setProperty("--oshi",oshi);
}
function saveSkin(v){try{localStorage.setItem(skinKey(),JSON.stringify({...loadSkin(),...v}))}catch(e){}applySkin();drawSkins()}
function drawSkins(){
  const cur=loadSkin().skin||"base";
  $("#skins").innerHTML=Object.entries(SKINS).map(([k,v])=>{const ok=skinOk(k),n=v.need;
    return `<button class="skin ${k===cur?"sel":""}" data-k="${k}" ${ok?"":"disabled"}><span class="sw">${v.c.map(c=>`<i style="background:${c}"></i>`).join("")}</span>${v.n}<small>${ok?(k===cur?"使用中":""):n.stars?`★${n.stars}で解放（いま★${starSum()}）`:`ランク${n.rank}で解放`}</small></button>`}).join("");
  const o=$("#oshis");o.hidden=cur!=="oshi";
  o.innerHTML=OSHI.map(c=>`<button style="background:${c}" data-c="${c}" class="${loadSkin().oshi===c?"sel":""}" aria-label="推し色 ${c}"></button>`).join("");
}
$("#mSkin").onclick=()=>{$("#umenu").hidden=true;drawSkins();$("#skinSheet").hidden=false};
$("#skins").onclick=e=>{const b=e.target.closest(".skin");if(b&&!b.disabled)saveSkin({skin:b.dataset.k})};
$("#oshis").onclick=e=>{const b=e.target.closest("button");if(b)saveSkin({oshi:b.dataset.c})};
$("#skinX").onclick=()=>$("#skinSheet").hidden=true;
$("#skinSheet").onclick=e=>{if(e.target.id==="skinSheet")$("#skinSheet").hidden=true};
$("#mOut").onclick=async()=>{
  if(!confirm(`${me.name} からログアウトしますか？`))return;
  await cloud.logout();await setUser(null);screen("open");
};
function saveRec(r){
  myRecs.unshift(r);
  const oops=e=>{console.error(e);$("#rW").textContent+="（記録の保存に失敗しました）"};
  cloud.addRecord(r).catch(oops);
  const g=xpOf(r),r0=rankOf(myXp);
  myXp+=g;cloud.addXp(g).catch(oops);
  const r1=rankOf(myXp);
  $("#rR").textContent=r1>r0?`🎉 RANK UP！ ランク${r0} → ${r1}（+${g} XP）`:`+${g} XP　ランク${r1}`;
  $("#rR").classList.toggle("up",r1>r0);
}
// オープニングで数字と記号をふわふわ流す
(()=>{const ch="0123456789+−×÷=";let h="";for(let i=0;i<18;i++)h+=`<span class="fl" style="left:${rnd(0,92)}%;font-size:${rnd(28,70)}px;animation-duration:${rnd(9,20)}s;animation-delay:-${rnd(0,20)}s">${ch[rnd(0,ch.length-1)]}</span>`;$("#fls").innerHTML=h})();
const z=x=>String(x).padStart(2,"0");
function when(t){const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}） ${z(d.getHours())}:${z(d.getMinutes())}`}
const dur=s=>s<60?s.toFixed(1)+"秒":`${Math.floor(s/60)}分${z(Math.floor(s%60))}秒`;
const OLD={basic:"初級",mid:"中級",high:"上級"};
function recTag(r){
  if(!r.st)return `<span class="tag ${r.c}">${OLD[r.c]||""}</span>`;
  const [w,s]=r.st.split("-").map(Number);
  return `<span class="tag w${w}">${r.st} ${stageName(w-1,s-1)}${r.clear?" ✓":""}</span>`;
}
function showRecs(){
  const l=myRecs;
  $("#recs").innerHTML=l.length?l.map(r=>`<div class="rec"><div class="hd"><span>${when(r.at)}</span>${recTag(r)}</div><div class="row"><div><b>${r.n}</b><span>問題数</span></div><div><b>${dur(r.sec)}</b><span>計算時間</span></div><div><b>${r.combo}</b><span>最大コンボ</span></div><div><b>${r.score}</b><span>スコア</span></div></div></div>`).join(""):`<p>まだ記録がありません。<br>ステージを遊ぶと、ここに残ります。</p>`;
  screen("rec");$("#rec").scrollTop=0;
}
$("#recBack").onclick=goMap;
</script>

<script type="module">
/* ---------- 保存先（Firebase。未設定ならこの端末の中） ----------
   Firebaseコンソールの「プロジェクトの設定 → マイアプリ」にある firebaseConfig をここに貼る */
const FIREBASE_CONFIG={
  apiKey:"",
  authDomain:"",
  projectId:"",
  appId:""
};
const V="https://www.gstatic.com/firebasejs/10.12.2/";
// 名前は大文字小文字や全角半角の違いを同じ人として扱う
const norm=n=>n.normalize("NFKC").toLowerCase();
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const fail=code=>Object.assign(new Error(code),{code});
let cloud;
if(FIREBASE_CONFIG.apiKey){
  const [{initializeApp},A,F]=await Promise.all(["firebase-app","firebase-auth","firebase-firestore"].map(m=>import(V+m+".js")));
  const app=initializeApp(FIREBASE_CONFIG),auth=A.getAuth(app),db=F.getFirestore(app);
  // Firebaseはメールアドレスでしか登録できないので、名前から決まった形のアドレスを作る
  const mail=async n=>"u"+(await sha(norm(n))).slice(0,40)+"@users.dopa-math.app";
  const who=u=>u&&{id:u.uid,name:u.displayName||""};
  const recs=()=>F.collection(db,"users",auth.currentUser.uid,"records");
  const prof=()=>F.doc(db,"users",auth.currentUser.uid);
  cloud={
    mode:"firebase",
    async register(name,pw){const c=await A.createUserWithEmailAndPassword(auth,await mail(name),pw);await A.updateProfile(c.user,{displayName:name});return who(c.user)},
    async login(name,pw){return who((await A.signInWithEmailAndPassword(auth,await mail(name),pw)).user)},
    logout:()=>A.signOut(auth),
    addRecord:r=>F.addDoc(recs(),r),
    async listRecords(){return (await F.getDocs(F.query(recs(),F.orderBy("at","desc"),F.limit(300)))).docs.map(d=>d.data())},
    async getProfile(){const d=await F.getDoc(prof()),x=d.exists()?d.data():{};return {xp:x.xp??null,prog:x.prog||{}}},
    setXp:x=>F.setDoc(prof(),{xp:x},{merge:true}),
    addXp:x=>F.setDoc(prof(),{xp:F.increment(x)},{merge:true}),
    saveProg:(id,stars)=>F.setDoc(prof(),{prog:{[id]:stars}},{merge:true})
  };
  window.cloud=cloud;
  A.onAuthStateChanged(auth,u=>onAuth(who(u)));
}else{
  const UK="dopamath-local-users",MK="dopamath-local-me";
  const load=()=>{try{return JSON.parse(localStorage.getItem(UK))||{}}catch(e){return {}}};
  const keep=u=>localStorage.setItem(UK,JSON.stringify(u));
  const who=k=>{const u=load()[k];return u&&{id:k,name:u.name}};
  const edit=f=>{const u=load(),k=localStorage.getItem(MK);f(u[k]);keep(u)};
  cloud={
    mode:"local",
    async register(name,pw){const u=load(),k=norm(name);if(u[k])throw fail("auth/email-already-in-use");const salt=crypto.randomUUID();u[k]={name,salt,pw:await sha(salt+pw),recs:[]};keep(u);localStorage.setItem(MK,k);return who(k)},
    async login(name,pw){const k=norm(name),x=load()[k];if(!x||x.pw!==await sha(x.salt+pw))throw fail("auth/invalid-credential");localStorage.setItem(MK,k);return who(k)},
    async logout(){localStorage.removeItem(MK)},
    async addRecord(r){edit(x=>{x.recs.unshift(r);x.recs=x.recs.slice(0,300)})},
    async listRecords(){return [...(load()[localStorage.getItem(MK)]?.recs||[])]},
    async getProfile(){const x=load()[localStorage.getItem(MK)]||{};return {xp:x.xp??null,prog:x.prog||{}}},
    async setXp(v){edit(x=>x.xp=v)},
    async addXp(v){edit(x=>x.xp=(x.xp||0)+v)},
    async saveProg(id,stars){edit(x=>{x.prog=x.prog||{};x.prog[id]=stars})}
  };
  window.cloud=cloud;
  onAuth(who(localStorage.getItem(MK))||null);
}
</script>
