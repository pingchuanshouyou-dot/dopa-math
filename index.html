<body>
<div id="app">
  <header>
    <div class="hud"><button id="quit" aria-label="マップにもどる">✕</button><span id="stg"></span><span id="sc">0</span><span id="cb"></span><button id="mute" aria-label="音のオンオフ">🔊</button></div>
    <div class="oya" id="oyaP"><span>📱 TikTok解禁</span><div class="bar"><i id="oyaBarP"></i></div><b id="oyaTxtP"></b></div>
  </header>
  <div class="prog" id="prog"><div class="bar"><i id="pBar"></i></div><span id="pTxt"></span><span id="heartsP"></span></div>
  <div class="boss" id="boss" hidden>
    <div class="bemo" id="bEmo"></div>
    <div class="binfo"><div class="bname"><b id="bName"></b><span id="hearts"></span></div><div class="bar hp"><i id="bHp"></i></div></div>
    <div class="dmg" id="dmg"></div>
    <div class="say" id="say" aria-live="polite"></div>
  </div>
  <main id="stage">
    <div id="fev" hidden>🔥 FEVER TIME 🔥</div>
    <div id="card" class="card">
      <div class="tbar" aria-hidden="true"><i id="tBar"></i><b id="tMark"></b></div>
      <button class="weak" id="weak" aria-label="数字を簡単にする">🧪 弱体化<b id="weakN">3</b></button>
      <div id="eq"><div id="eqQ"></div><div id="eqR"></div></div>
      <div class="hint" id="hint">答えを打つだけ。エンター不要！</div>
    </div>
    <div id="pop"></div>
    <div id="spd"></div>
  </main>
  <footer>
    <div class="pad" id="pad">
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key neg" data-k="-" aria-label="マイナス">−</button><button class="key" data-k="0">0</button><button class="key fn" data-k="C" aria-label="クリア">C</button>
    </div>
  </footer>
</div>
<div id="flash"></div>

<section id="open" class="ov">
  <div id="fls"></div>
  <div class="logo"><h1>Dopa<em>-</em>Math</h1></div>

  <div class="opbtns" id="opLoad"><p>読み込み中…</p></div>
  <div class="opbtns" id="opGuest" hidden>
    <button class="cta" id="goReg">新規登録</button>
    <button class="cta ghost" id="goLogin">ログイン</button>
  </div>
  <div class="opbtns" id="opUser" hidden>
    <button class="cta" id="goPlay">▶ はじめる</button>
    <p id="opWho"></p>
    <button class="cta alt" id="goSwitch">別の名前でログイン</button>
  </div>
  <p class="note" id="opNote"></p>
</section>

<section id="auth" class="ov" hidden>
  <button class="topbtn l" id="authBack">← 戻る</button>
  <h1 id="authT"></h1>
  <form class="form" id="authF" novalidate>
    <label>名前<input id="aName" autocomplete="username" maxlength="20" autocapitalize="off"></label>
    <label>パスワード <small>6文字以上</small><span class="pw"><input id="aPw" type="password"><button type="button" id="aEye" aria-label="パスワードを表示" aria-pressed="false">👁️</button></span></label>
    <p class="err" id="aErr"></p>
    <button class="cta" id="aGo"></button>
  </form>
  <button class="cta alt" id="authSwap"></button>
</section>

<section id="map" class="ov" hidden>
  <button class="topbtn l" id="who" aria-haspopup="menu"><span id="whoN"></span><small id="whoR"></small></button>
  <div class="umenu" id="umenu" role="menu" hidden>
    <div class="rank">
      <div class="rk"><span>RANK</span><b id="mRank"></b></div>
      <div class="ti"><b id="mTitle"></b><div class="bar"><i id="mBar"></i></div><small id="mNext"></small></div>
    </div>
    <p class="how">先のワールドほど、速く正確に解くほどXPがたまってランクが上がります</p>
    <button class="item" id="mRec" role="menuitem">📒 記録</button>

  </div>

  <div class="oya" id="oyaM"><span>📱 TikTok解禁</span><div class="bar"><i id="oyaBarM"></i></div><b id="oyaTxtM"></b></div>
  <div class="wnav">
    <button class="wbtn" id="wPrev" aria-label="前のワールド">◀</button>
    <div class="wt"><small id="wNo"></small><b id="wName"></b></div>
    <button class="wbtn" id="wNext" aria-label="次のワールド">▶</button>
  </div>
  <div class="mapbox" id="mapbox"></div>
  <p class="wdesc" id="wDesc"></p>
  <div class="sheet" id="skinSheet" hidden>
    <div class="in">
      <h2>🎨 着せ替え</h2>
      <p>星を集めたりランクを上げたりすると、新しい色が解放されるよ</p>
      <div class="skins" id="skins"></div>
      <div class="oshis" id="oshis" hidden></div>
      <button class="cta alt" id="skinX">とじる</button>
    </div>
  </div>
  <div class="sheet" id="sheet" hidden>
    <div class="in">
      <span class="no" id="shNo"></span>
      <div class="bemo" id="shEmo"></div>
      <h2 id="shName"></h2>
      <p id="shDesc"></p>
      <p id="shInfo"></p>
      <button class="cta" id="shGo">スタート！</button>
      <button class="cta alt" id="shX">とじる</button>
    </div>
  </div>
</section>

<section id="rec" class="ov" hidden>
  <button class="topbtn l" id="recBack">← 戻る</button>
  <h1>記録</h1>
  <div class="recs" id="recs"></div>
</section>

<section id="res" class="ov" hidden>
  <h1 id="rH"></h1>
  <div class="cert"><div class="cin">
    <div class="ctop"><span id="cStage"></span><span id="cDate"></span></div>
    <div class="cname" id="cName"></div>
    <div class="ctitle" id="cTitle"></div>
    <div class="stars" id="rS"></div>
    <div class="cbadge" id="cBadge"></div>
    <div class="cstats">
      <div><b id="rN">0</b><span>解いた問題</span></div>
      <div><b id="rA">0%</b><span>正解率</span></div>
      <div><b id="rC">0</b><span>最大コンボ</span></div>
      <div><b id="rT">-</b><span>計算時間</span></div>
    </div>
    <div class="cfoot">Dopa-Math 認定 <span id="cStreak"></span></div>
  </div></div>
  <div class="meter"><span id="rM"></span><div class="bar"><i id="rB"></i></div></div>
  <p id="rR"></p>
  <p id="rW"></p>
  <button class="cta" id="nextSt">次のステージへ ▶</button>
  <button class="cta line" id="share">LINEで送る</button>
  <button class="cta alt" id="again">もう一回</button>
  <button class="cta alt" id="toMap">マップへもどる</button>
</section>

<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script>
const $=s=>document.querySelector(s);
let runId=0,sw=0,ss=0,kind,stg,qn,pts,seen,q,typed="",t0=0,tSum=0,score,combo,maxCombo,done,okN,misses,fever,busy,running=false,
    weakLeft,hlOn,tRaf,tplMiss,hp,hpMax,hearts,muted=false,bi=0,bgT;

/* ---------- 音 ---------- */
let ac;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==="suspended")ac.resume();
}
function tone(f,d,type,v,when){
  if(!ac||muted)return;
  const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(when||0);
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d);
}
function sfxOk(c){
  const f=660*Math.pow(1.0595,Math.min(c,12));
  tone(f,.12,"triangle",.22);tone(f*1.5,.18,"sine",.18,.07);tone(f*2,.25,"square",.05,.14);
  if(c>0&&c%5===0){[1,1.25,1.5,2].forEach((m,i)=>tone(523*m,.3,"sawtooth",.07,i*.08))}
}
function sfxNg(){tone(160,.25,"sawtooth",.14);tone(110,.3,"sawtooth",.14,.12)}
function sfxCrit(){tone(90,.35,"square",.2);tone(1400,.15,"sawtooth",.08,.02);tone(1900,.2,"triangle",.1,.08)}
function sfxHint(){tone(1320,.08,"sine",.08);tone(1760,.12,"sine",.07,.07)}
function sfxWin(){[1,1.25,1.5,2,2.5].forEach((m,i)=>tone(523*m,.35,"triangle",.12,i*.1))}
const SC=[0,2,4,7,9,12,9,7];
function bgm(){
  clearTimeout(bgT);if(!running)return;
  const sh=Math.floor(bi/8)%2?5:0,boss=kind!=="normal";
  tone((boss?165:220)*Math.pow(2,(SC[bi%8]+sh+(fever>0?12:0))/12),.12,boss?"sawtooth":"triangle",boss?.035:.05);
  bi++;bgT=setTimeout(bgm,fever>0?120:boss?180:230);
}

/* ---------- 出題 ---------- */
const sid=(w,s)=>`${w+1}-${s+1}`;
function level(){
  const base=kind==="normal"?(done<4?0:done<8?1:2):Math.floor((1-hp/hpMax)*3)+(kind==="big"?1:0);
  return Math.min(2,base+(stg.L||0));
}
function nextQ(){
  // alt のステージは型を順番に交互で出す（例：マイナスを引く計算 → 掛け算 → …）
  q=makeQ(stg.alt?[stg.t[qn%stg.t.length]]:stg.t,level(),seen);seen.add(q.text);qn++;
  showQ();enter();
}
function showQ(){
  typed="";hlOn=false;
  const el=$("#eqQ");el.className=q.text.length>26?"xs":q.text.length>15?"s":"";
  el.innerHTML=html(q.ast);
  $("#eqR").className="";draw();
  $("#weak").disabled=weakLeft<=0||q.weak;$("#weakN").textContent=weakLeft;
  $("#hint").textContent=q.weak?"🧪 弱体化中！ルールは同じ、数字だけ小さくしたよ":"答えを打つだけ。エンター不要！";
  t0=performance.now();
}
const show=t=>t.replace("-","−");
function draw(){$("#eqR").innerHTML="= "+(typed?show(typed):`<span class="ph">?</span>`)}

/* ---------- 制限時間：3秒でヒント、時間切れでハートが減って次の問題へ ---------- */
function tick(){
  if(!running)return;
  tRaf=requestAnimationFrame(tick);
  if(busy)return;
  const lim=LIMIT[sw],dt=(performance.now()-t0)/1000,left=Math.max(0,1-dt/lim),bar=$("#tBar");
  bar.style.transform=`scaleX(${left})`;
  bar.className=dt<QUICK?"":left>.25?"mid":"low";
  if(dt>=QUICK&&!typed)showHint();
  if(dt>=lim)timeUp();
}

/* ---------- 救済①：3秒入力がなければ、最初に計算する塊とぶつかる符号を光らせる ---------- */
// 光らせた場所に合わせて、何から計算すればいいかを一言で
function hintText(c,cl){
  if(!c)return "水色の符号に注目！ ＋と−がぶつかってるよ";
  if(c.t==="p")return "💡 光っているカッコの中から計算してみて！";
  if(c.t==="w")return "💡 光っている2乗から計算してみて！";
  if(c.op==="×"||c.op==="÷")return "💡 光っている掛け算・割り算から先に計算してみて！";
  return "💡 光っている左の2つから計算してみて！";
}
function showHint(){
  if(!running||busy||hlOn)return;
  hlOn=true;
  if(kind!=="normal")say(SAY.idle);
  const c=chunk(q.ast),cl=clashes(q.ast),el=$("#eqQ");
  if(!c&&!cl.length)return;
  el.classList.add("dim");
  if(c)el.querySelector(`[data-i="${c.id}"]`).classList.add("hl");
  $("#hint").textContent=hintText(c,cl);
  // 塊（ピンク）があるときは、その中でぶつかる符号だけ水色にして、目線がばらけないようにする
  const box=c&&el.querySelector(`[data-i="${c.id}"]`);
  cl.forEach(([o,l])=>{const op=el.querySelector(`[data-o="${o}"]`);if(box&&!box.contains(op))return;
    op.classList.add("hs");el.querySelector(`[data-i="${l}"] .sg`).classList.add("hs")});
  sfxHint();
}

/* ---------- 救済②：弱体化。式の形はそのまま、数字だけ小さく ---------- */
$("#weak").onclick=()=>{
  if(!running||busy||weakLeft<=0||q.weak)return;
  audio();
  const w=weaken(q);
  if(!w){pop("もう最弱だよ🧪");return}  // もとから一番小さい数のときは回数を使わない
  weakLeft--;q=w;
  card.classList.remove("weakfx");void card.offsetWidth;card.classList.add("weakfx");
  tone(500,.15,"sine",.12);tone(300,.25,"sine",.1,.1);
  pop("🧪 弱体化！");showQ();
};

/* ---------- 演出 ---------- */
const card=$("#card");
function enter(){
  card.style.transition="none";
  card.style.transform="translateY(40px) scale(.94)";card.style.opacity="0";
  void card.offsetWidth;
  card.style.transition="transform .12s ease-out,opacity .12s";
  card.style.transform="";card.style.opacity="1";
  card.classList.remove("hit","miss");
}
function burst(){
  const r=card.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const em=fever>0?["🔥","⭐","✨"]:["✨","⭐","💥"];
  for(let i=0;i<14;i++){
    const e=document.createElement("span");e.className="p";
    e.textContent=em[i%em.length];e.style.left=cx+"px";e.style.top=cy+"px";
    const a=Math.random()*6.28,d=80+Math.random()*120;
    e.style.setProperty("--dx",Math.cos(a)*d+"px");e.style.setProperty("--dy",Math.sin(a)*d+"px");
    document.body.appendChild(e);setTimeout(()=>e.remove(),750);
  }
}
const WORDS=["天才すぎ✨","神！！","えぐい🔥","優勝🏆","それな💯","しか勝たん💕","沼る〜🫠","ガチ盛れ📸","最強かよ👑"];
function pop(t,id){const p=$(id||"#pop");p.textContent=t;p.classList.remove("go");void p.offsetWidth;p.classList.add("go")}
// ステージ中の「◯秒後に次へ」用。やめた後や別のステージを始めた後には動かない
function later(f,ms){const id=runId;setTimeout(()=>{if(running&&id===runId)f()},ms)}
/* ---------- ボスのセリフ（吹き出し） ---------- */
let foe=null,sayT;
const SAY={
  hurt:["ぴえん🥺","計算はやすぎ…！","ちょ、待って😵","いたっ💦","それ反則でしょ…"],
  crit:["クリティカルはずるい😭","FEVERやめて〜🔥","まぶしっ…！✨"],
  taunt:["ざんね〜ん😜","そこ間違えるんだ〜？","ふふん、効いてないよ"],
  idle:"あれ〜？手が止まってるよ？😏",lose:"覚えてなさいよ〜😭",win:"勝っちゃった〜✌️"
};
const pick1=a=>a[rnd(0,a.length-1)];
function say(t,ms=1700){const e=$("#say");e.textContent=t;fx(e,"on");clearTimeout(sayT);sayT=setTimeout(()=>e.classList.remove("on"),ms)}
function fx(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
// ダメージや攻撃の動きが終わったら、いつものふわふわに戻す
$("#bEmo").addEventListener("animationend",e=>{if(e.animationName!=="bob")e.target.classList.remove("hit","atk")});
function hud(){
  $("#sc").textContent=score;
  $("#cb").textContent=combo>1?combo+" COMBO":"";
  document.body.classList.toggle("fever",fever>0);
  $("#fev").hidden=!(fever>0);
  const h="❤️".repeat(hearts)+"🤍".repeat(HEARTS-hearts);
  if(kind==="normal"){$("#pBar").style.width=done/NORMAL_N*100+"%";$("#pTxt").textContent=`${done} / ${NORMAL_N}`;$("#heartsP").textContent=h}
  else{$("#bHp").style.width=Math.max(0,hp/hpMax*100)+"%";$("#hearts").textContent=h}
  drawOya("P");
}

/* ---------- 親黙らせ（TikTok解禁）ゲージ：今日の正解数 ---------- */
const today=()=>new Date().toDateString();
const todays=()=>myRecs.filter(r=>new Date(r.at).toDateString()===today());
// 残り問題数は見せずにパーセントだけ。FEVER中の正解は2ポイントでゲージがぐんぐん伸びる
function oyaPct(){const t=todays().reduce((t,r)=>t+(r.pts??r.ok),0)+(running?pts:0);return Math.min(100,Math.floor(t/DAILY*100))}
function drawOya(k){
  const p=oyaPct();
  $("#oyaBar"+k).style.width=p+"%";
  $("#oyaTxt"+k).textContent=p>=100?"解禁🎉":p+"%";
  $("#oya"+k).classList.toggle("full",p>=100);
}

/* ---------- 回答（テンキー・エンター不要の即判定） ---------- */
function press(k){
  if(busy||!running)return;
  audio();
  if(k==="C"){typed="";draw();return}
  if(k==="-"){if(typed)return;typed="-"}else typed+=k;
  const want=String(q.ans);
  if(!want.startsWith(typed)){miss();return}  // 1文字でもズレたら即ミス
  tone(900,.04,"sine",.07);
  if(typed===want)correct();else draw();
}
function correct(){
  busy=true;draw();card.classList.add("hit");
  const dt=(performance.now()-t0)/1000,quick=dt<=QUICK,sp=quick?1.5:1;
  okN++;done++;pts+=fever>0?2:1;combo++;maxCombo=Math.max(maxCombo,combo);tSum+=dt;
  // FEVER中に正解した分がクリティカル（2倍）
  const crit=fever>0;
  score+=Math.round((crit?20:10)*sp);
  if(quick)pop(`⚡ ${dt.toFixed(1)}秒！ ×1.5`,"#spd");
  if(kind!=="normal"){
    const dmg=Math.round(BASE_DMG*(1+.1*(combo-1))*(crit?2:1)*sp);
    hp-=dmg;fx($("#bEmo"),"hit");
    const d=$("#dmg");d.textContent=(crit?"CRITICAL!! ":"")+"−"+dmg;d.classList.toggle("crit",crit);fx(d,"go");
    if(crit){fx($("#app"),"bigshake");sfxCrit();if(navigator.vibrate)navigator.vibrate([20,20,40])}
    if(hp>0)say(crit?pick1(SAY.crit):pick1([foe.ow,...SAY.hurt]));
  }
  if(combo%5===0){fever=5;pop("FEVER!!")}else{if(fever>0)fever--;if(!crit||kind==="normal")pop(WORDS[rnd(0,WORDS.length-1)])}
  if(kind!=="normal"&&hp<=0){hud();sfxOk(combo);burst();$("#bEmo").classList.add("dead");pop("撃破！！");say(SAY.lose,1200);later(()=>finish("clear"),900);return}
  sfxOk(combo);burst();
  if(navigator.vibrate)navigator.vibrate(12);
  hud();
  later(()=>{if(kind==="normal"&&done>=NORMAL_N){finish("clear");return}nextQ();busy=false},100);
}
// まちがい・時間切れの共通処理。ハートが1つ減ってコンボが切れる。ボス戦で0になったら負け
function hurt(){
  misses++;tplMiss[q.tpl]=(tplMiss[q.tpl]||0)+1;
  combo=0;fever=0;hearts=Math.max(0,hearts-1);sfxNg();
  card.classList.remove("hit");card.classList.add("miss");
  fx($("#stage"),"shake");if(navigator.vibrate)navigator.vibrate([30,30,30]);
  if(kind!=="normal"){fx($("#bEmo"),"atk");fx($("#flash"),"go");say(hearts>0?pick1(SAY.taunt):SAY.win)}
  hud();
  if(kind!=="normal"&&hearts<=0){later(()=>finish("lose"),700);return true}
  return false;
}
function miss(){
  busy=true;
  if(hurt())return;
  // まちがえた最後の1文字だけ消す。合っていた所（−1 など）は残して、そこから打ち直せる
  typed=typed.slice(0,-1);
  // 答えは見せない。時間内なら同じ問題にもう一度チャレンジ
  later(()=>{draw();card.classList.remove("miss");busy=false},350);
}
function timeUp(){
  busy=true;
  if(hurt())return;
  pop("⏰ 時間切れ！");
  $("#eqR").className="rev";$("#eqR").textContent="答えは "+show(String(q.ans));done++;
  later(()=>{if(kind==="normal"&&done>=NORMAL_N){finish("clear");return}nextQ();busy=false},1100);
}

/* ---------- テンキー ---------- */
const KP=["💗","✨","⭐","🩷","💫"];
function kiss(x,y){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const e=document.createElement("span");e.className="kp";e.textContent=KP[rnd(0,KP.length-1)];
  e.style.left=x+"px";e.style.top=y+"px";e.style.setProperty("--dx",rnd(-24,24)+"px");
  document.body.appendChild(e);setTimeout(()=>e.remove(),720);
}
$("#pad").addEventListener("pointerdown",e=>{
  const b=e.target.closest(".key");if(!b)return;
  e.preventDefault();
  fx(b,"on");kiss(e.clientX,e.clientY);

  const days=new Set(myRecs.map(r=>dayKey(r.at)));

  if(!today)d.setDate(d.getDate()-1);   // 今日まだでも、昨日までの記録は切れていない
  let n=0;while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}

}

// 新しい人に切り替わったら記録を読み込む。同じ人なら読み込み中の約束を返す
function setUser(u){
  if(u&&me&&u.id===me.id){if(u.name)me.name=u.name;return loadP}
  me=u;myRecs=[];myXp=0;myProg={};
  loadP=u?Promise.all([cloud.listRecords(),cloud.getProfile()]).then(([l,p])=>{
    if(me!==u)return;
    myRecs=l;myProg=p.prog||{};
    // XPを持っていない人は、今までの記録から計算して保存しておく
    let x=p.xp;if(x==null){x=l.reduce((t,r)=>t+xpOf(r),0);cloud.setXp(x).catch(e=>console.error(e))}
    myXp=x;

    mapW=0;while(mapW<WORLDS.length-1&&unlocked(mapW+1,0))mapW++;

/* ---------- ランク（1〜100） ----------
   XP = スコア × ワールドの重さ × 正解率。スコアには速さボーナス・フィーバー・クリアボーナスが入っている */
const TIERS=["計算デビュー🐣","ゆる計算ちゃん🌱","マイナスなかよし🫧","カッコ攻略中🎀","九九ガチ勢🌶️","計算ちょい盛れ✨","四則インフルエンサー📱","分数マスター🔮","計算のカリスマ💎","計算の女神👑"];
const need=r=>Math.round(30*Math.pow(r-1,1.9));  // ランクrになるのに必要な合計XP。100で約18.6万
const rankOf=x=>{let r=1;while(r<100&&x>=need(r+1))r++;return r};
const COURSE_W={basic:1,mid:1.5,high:2};  // ワールド制より前の記録用
function xpOf(r){
  const w=r.st?1+(+r.st.split("-")[0]-1)*.25:COURSE_W[r.c]||1,m=r.miss??(r.n-r.ok);
  return Math.round(r.score*w*(r.ok+m?r.ok/(r.ok+m):0));
}
let myXp=0;
function drawRank(){
  const r=rankOf(myXp);
  $("#whoN").textContent="👤 "+me.name;$("#whoR").textContent="ランク"+r;
  $("#mRank").textContent=r;$("#mTitle").textContent=TIERS[Math.floor((r-1)/10)];
  const a=need(r),b=need(r+1);
  $("#mBar").style.width=(r>=100?100:(myXp-a)/(b-a)*100)+"%";
  $("#mNext").textContent=r>=100?`最高ランク！ 合計 ${myXp.toLocaleString()} XP`:`次のランクまで ${(b-myXp).toLocaleString()} XP`;
}

}
// オープニングで数字と記号をふわふわ流す
(()=>{const ch="0123456789+−×÷=";let h="";for(let i=0;i<18;i++)h+=`<span class="fl" style="left:${rnd(0,92)}%;font-size:${rnd(28,70)}px;animation-duration:${rnd(9,20)}s;animation-delay:-${rnd(0,20)}s">${ch[rnd(0,ch.length-1)]}</span>`;$("#fls").innerHTML=h})();
const z=x=>String(x).padStart(2,"0");
function when(t){const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}） ${z(d.getHours())}:${z(d.getMinutes())}`}
const dur=s=>s<60?s.toFixed(1)+"秒":`${Math.floor(s/60)}分${z(Math.floor(s%60))}秒`;
const OLD={basic:"初級",mid:"中級",high:"上級"};
function recTag(r){
  if(!r.st)return `<span class="tag ${r.c}">${OLD[r.c]||""}</span>`;
  const [w,s]=r.st.split("-").map(Number);
  return `<span class="tag w${w}">${r.st} ${stageName(w-1,s-1)}${r.clear?" ✓":""}</span>`;
}
function showRecs(){
  const l=myRecs;
  $("#recs").innerHTML=l.length?l.map(r=>`<div class="rec"><div class="hd"><span>${when(r.at)}</span>${recTag(r)}</div><div class="row"><div><b>${r.n}</b><span>問題数</span></div><div><b>${dur(r.sec)}</b><span>計算時間</span></div><div><b>${r.combo}</b><span>最大コンボ</span></div><div><b>${r.score}</b><span>スコア</span></div></div></div>`).join(""):`<p>まだ記録がありません。<br>ステージを遊ぶと、ここに残ります。</p>`;
  screen("rec");$("#rec").scrollTop=0;
}
$("#recBack").onclick=goMap;
</script>

<script type="module">
/* ---------- 保存先（Firebase。未設定ならこの端末の中）。設定は js/config.js の FIREBASE_CONFIG ---------- */
const V="https://www.gstatic.com/firebasejs/10.12.2/";
// 名前は大文字小文字や全角半角の違いを同じ人として扱う
const norm=n=>n.normalize("NFKC").toLowerCase();
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const fail=code=>Object.assign(new Error(code),{code});
let cloud;
if(FIREBASE_CONFIG.apiKey){
  const [{initializeApp},A,F]=await Promise.all(["firebase-app","firebase-auth","firebase-firestore"].map(m=>import(V+m+".js")));
  const app=initializeApp(FIREBASE_CONFIG),auth=A.getAuth(app),db=F.getFirestore(app);
  // Firebaseはメールアドレスでしか登録できないので、名前から決まった形のアドレスを作る
  const mail=async n=>"u"+(await sha(norm(n))).slice(0,40)+"@users.dopa-math.app";
  const who=u=>u&&{id:u.uid,name:u.displayName||""};
  const recs=()=>F.collection(db,"users",auth.currentUser.uid,"records");
  const prof=()=>F.doc(db,"users",auth.currentUser.uid);
  cloud={
    mode:"firebase",
    async register(name,pw){const c=await A.createUserWithEmailAndPassword(auth,await mail(name),pw);await A.updateProfile(c.user,{displayName:name});return who(c.user)},
    async login(name,pw){return who((await A.signInWithEmailAndPassword(auth,await mail(name),pw)).user)},
    logout:()=>A.signOut(auth),
    addRecord:r=>F.addDoc(recs(),r),
    async listRecords(){return (await F.getDocs(F.query(recs(),F.orderBy("at","desc"),F.limit(300)))).docs.map(d=>d.data())},
    async getProfile(){const d=await F.getDoc(prof()),x=d.exists()?d.data():{};return {xp:x.xp??null,prog:x.prog||{}}},
    setXp:x=>F.setDoc(prof(),{xp:x},{merge:true}),
    addXp:x=>F.setDoc(prof(),{xp:F.increment(x)},{merge:true}),
    saveProg:(id,stars)=>F.setDoc(prof(),{prog:{[id]:stars}},{merge:true})
  };
  window.cloud=cloud;
  A.onAuthStateChanged(auth,u=>onAuth(who(u)));
}else{
  const UK="dopamath-local-users",MK="dopamath-local-me";
  const load=()=>{try{return JSON.parse(localStorage.getItem(UK))||{}}catch(e){return {}}};
  const keep=u=>localStorage.setItem(UK,JSON.stringify(u));
  const who=k=>{const u=load()[k];return u&&{id:k,name:u.name}};
  const edit=f=>{const u=load(),k=localStorage.getItem(MK);f(u[k]);keep(u)};
  cloud={
    mode:"local",
    async register(name,pw){const u=load(),k=norm(name);if(u[k])throw fail("auth/email-already-in-use");const salt=crypto.randomUUID();u[k]={name,salt,pw:await sha(salt+pw),recs:[]};keep(u);localStorage.setItem(MK,k);return who(k)},
    async login(name,pw){const k=norm(name),x=load()[k];if(!x||x.pw!==await sha(x.salt+pw))throw fail("auth/invalid-credential");localStorage.setItem(MK,k);return who(k)},
    async logout(){localStorage.removeItem(MK)},
    async addRecord(r){edit(x=>{x.recs.unshift(r);x.recs=x.recs.slice(0,300)})},
    async listRecords(){return [...(load()[localStorage.getItem(MK)]?.recs||[])]},
    async getProfile(){const x=load()[localStorage.getItem(MK)]||{};return {xp:x.xp??null,prog:x.prog||{}}},
    async setXp(v){edit(x=>x.xp=v)},
    async addXp(v){edit(x=>x.xp=(x.xp||0)+v)},
    async saveProg(id,stars){edit(x=>{x.prog=x.prog||{};x.prog[id]=stars})}
  };
  window.cloud=cloud;
  onAuth(who(localStorage.getItem(MK))||null);
}
</script>
